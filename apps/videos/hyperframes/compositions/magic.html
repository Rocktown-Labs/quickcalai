<template id="magic-template">
  <div data-composition-id="magic" data-width="1080" data-height="1920" data-start="0">
    <div class="scene-content">
      <div class="text-top">
        <h2 class="subtitle">AI extracts details instantly.</h2>
      </div>

      <div class="processing-button">
        <div class="spinner">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-zap animate-pulse"><path d="M4 14.5a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H4z"/><path d="M20 14.5a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2h-1a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h1z"/><path d="M14.5 4a2 2 0 0 0-2-2h-1a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2V4z"/><path d="M14.5 20a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v1z"/></svg>
        </div>
        <span class="button-text">Processing document with AI...</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-val">0</div>
          <div class="stat-label">Events found</div>
        </div>
      </div>
    </div>

    <style>
      [data-composition-id="magic"] {
        background: oklch(0.09 0 0);
        font-family: "Plus Jakarta Sans", sans-serif;
        color: oklch(0.95 0 0);
      }
      .scene-content {
        width: 100%;
        height: 100%;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .text-top {
        margin-bottom: 120px;
        text-align: center;
      }
      .subtitle {
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .processing-button {
        width: 100%;
        background: oklch(0.58 0.22 25);
        color: white;
        padding: 48px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        margin-bottom: 40px;
        box-shadow: 0 0 80px oklch(0.58 0.22 25 / 0.3);
      }
      .button-text { font-size: 36px; font-weight: 600; }
      .progress-bar {
        width: 100%;
        height: 12px;
        background: oklch(0.17 0 0);
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 80px;
      }
      .progress-fill {
        width: 0%;
        height: 100%;
        background: oklch(0.58 0.22 25);
      }
      .stats {
        display: flex;
        gap: 32px;
        width: 100%;
      }
      .stat-card {
        flex: 1;
        background: oklch(0.13 0 0);
        padding: 48px;
        border-radius: 32px;
        text-align: center;
        border: 2px solid oklch(0.2 0 0);
      }
      .stat-val { font-size: 84px; font-weight: 800; color: oklch(0.58 0.22 25); }
      .stat-label { font-size: 24px; font-weight: 500; color: oklch(0.55 0 0); margin-top: 8px; }
      
      .spinner svg {
        animation: spin 2s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function() {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.from(".subtitle", { y: -40, opacity: 0, duration: 0.8, ease: "power3.out" }, 0.2);
        tl.from(".processing-button", { y: 40, opacity: 0, duration: 1, ease: "expo.out" }, 0.4);
        tl.from(".progress-bar", { opacity: 0, duration: 0.5 }, 0.8);
        tl.from(".stat-card", { scale: 0.8, opacity: 0, duration: 0.8, ease: "back.out(1.7)" }, 1.0);

        tl.to(".progress-fill", {
          width: "100%",
          duration: 3,
          ease: "none"
        }, 1.2);

        // Animate counter
        const counter = { val: 0 };
        tl.to(counter, {
          val: 12,
          duration: 2.5,
          onUpdate: function() {
            document.querySelector(".stat-val").innerText = Math.floor(counter.val);
          },
          ease: "power2.out"
        }, 1.5);

        window.__timelines["magic"] = tl;
      })();
    </script>
  </div>
</template>
