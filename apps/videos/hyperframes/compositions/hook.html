      </div>
    </div>

    <style>
      [data-composition-id="hook"] {
        background: oklch(0.09 0 0);

    <script>
      (function() {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.from(".title", {
          y: 60,
          opacity: 0,
          duration: 1.2,
          ease: "expo.out"
        }, 0.2);

        tl.from(".highlight", {
          scale: 0.8,
          opacity: 0,
          duration: 1,
          ease: "back.out(1.7)"
        }, 0.6);

        window.__timelines["hook"] = tl;
